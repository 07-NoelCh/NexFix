name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - name: Usar Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Linter (ESLint)
        run: npm run lint

      - name: Compilar TypeScript (tsc, strict)
        run: npm run build

      - name: Pruebas unitarias (Jest)
        run: npm run test:unit

      - name: Pruebas BDD (Cucumber)
        run: npm run test:e2e

      - name: Publicar reporte de Cucumber
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-report-node${{ matrix.node-version }}
          path: reports/cucumber.html
